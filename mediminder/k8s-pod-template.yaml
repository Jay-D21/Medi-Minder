apiVersion: v1
kind: Pod
spec:
  containers:
  - name: flutter
    # Replace the image below with the image tag you built from Dockerfile.ci.
    image: flutter-ci-agent:latest 
    command:
    - cat
    tty: true
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
