name: mediminder
description: A medication adherence mobile application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.1
  go_router: ^13.2.0
  intl: ^0.18.1
  google_mobile_ads: ^5.0.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_lints: ^3.0.1

flutter:
